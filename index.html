<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GH Image Uploader</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}

:root{
  --accent:#f59e0b;--accent-dk:#d97706;--accent-bg:rgba(245,158,11,.08);
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;
  --border:#e3e1db;--border2:#c9c7bf;
  --text:#1c1b18;--text2:#6b6860;--text3:#9e9b94;
  --green:#16a34a;--green-bg:rgba(22,163,74,.08);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --r:10px;--r-sm:7px;
  --mono:'SF Mono',ui-monospace,'Fira Code',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111110;--surface:#1c1b18;--surface2:#252420;
    --border:#2e2d28;--border2:#3d3c36;
    --text:#e8e4d9;--text2:#888780;--text3:#555450;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
    --shadow-md:0 4px 16px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.2);
  }
}

body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:14px;line-height:1.5}

/* Header */
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr{display:flex;align-items:center;justify-content:space-between;height:52px;max-width:580px;margin:0 auto;padding:0 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;font-family:var(--mono);letter-spacing:-.02em;color:var(--text);text-decoration:none}
.logo-ic{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-ic svg{width:15px;height:15px;color:#000}
.user-area{display:flex;align-items:center;gap:8px}
.u-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.u-name{font-size:13px;font-weight:500;display:none}
@media(min-width:400px){.u-name{display:block}}

/* Buttons */
button{cursor:pointer;font-family:inherit;border:none;background:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:var(--r-sm);font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent-dk)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:var(--border);color:var(--text3);cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text2);border:1px solid var(--border);transition:all .15s}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn svg,.btn-icon svg{width:15px;height:15px;flex-shrink:0}

/* Login */
#loginScreen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:36px 28px;width:100%;max-width:340px;text-align:center}
.login-logo{width:52px;height:52px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-logo svg{width:26px;height:26px;color:#000}
.login-card h1{font-size:18px;font-weight:700;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.btn-google{width:100%;height:42px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;transition:all .15s;cursor:pointer;font-family:inherit}
.btn-google:hover{background:var(--surface2);border-color:var(--border2)}
.btn-google:active{transform:scale(.98)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}

/* App */
#appScreen{display:none;flex:1;flex-direction:column;padding:20px 0 40px}
#appScreen.on{display:flex}
.wrap{width:100%;max-width:580px;margin:0 auto;padding:0 16px}

/* Notice */
.notice{display:flex;align-items:center;gap:10px;background:var(--accent-bg);border:1px solid rgba(245,158,11,.3);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:var(--accent-dk);margin-bottom:14px}
.notice svg{width:15px;height:15px;flex-shrink:0}
.notice a{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
@media(prefers-color-scheme:dark){.notice{color:var(--accent)}}

/* Section */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase}

/* Drop zone */
.drop-zone{position:relative;background:var(--surface);border:2px dashed var(--border2);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-bg)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-ic{width:40px;height:40px;margin:0 auto 10px;background:var(--surface2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s}
.drop-zone:hover .drop-ic,.drop-zone.drag-over .drop-ic{background:rgba(245,158,11,.15);color:var(--accent)}
.drop-ic svg{width:20px;height:20px}
.drop-title{font-size:14px;font-weight:600;margin-bottom:3px}
.drop-sub{font-size:12px;color:var(--text2);margin-bottom:10px}
.ftags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ftag{font-size:10px;font-weight:600;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)}

/* Queue items */
.q-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.q-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;transition:border-color .2s}
.q-item.uploading{border-color:rgba(245,158,11,.35)}
.q-item.done{border-color:rgba(22,163,74,.25)}
.q-item.error{border-color:rgba(220,38,38,.3)}
.q-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface2);display:block}
.q-info{min-width:0}
.q-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.q-meta{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:2px}
.q-prog{height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.q-prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.q-url-row{display:flex;align-items:center;gap:6px;margin-top:5px}
.q-url{font-size:11px;font-family:var(--mono);color:var(--accent-dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
@media(prefers-color-scheme:dark){.q-url{color:var(--accent)}}
.q-err{font-size:11px;color:var(--red);margin-top:4px}
.q-badge{font-size:10px;font-weight:600;font-family:var(--mono);padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0;letter-spacing:.02em}
.bp{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.bu{background:rgba(245,158,11,.12);color:var(--accent-dk);border:1px solid rgba(245,158,11,.3)}
.bd{background:var(--green-bg);color:var(--green);border:1px solid rgba(22,163,74,.3)}
.be{background:var(--red-bg);color:var(--red);border:1px solid rgba(220,38,38,.3)}
@media(prefers-color-scheme:dark){.bu{color:var(--accent)}}

.copy-btn{font-size:10px;font-weight:600;font-family:var(--mono);padding:2px 8px;border-radius:4px;background:none;border:1px solid var(--border);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--green);color:var(--green);background:var(--green-bg)}

/* Controls */
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-stat{margin-left:auto;font-size:12px;color:var(--text3);font-family:var(--mono)}
.divider{height:1px;background:var(--border);margin:18px 0}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
@media(min-width:480px){.modal-overlay{align-items:center;padding:16px}}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;border:1px solid var(--border);box-shadow:var(--shadow-md);max-height:92vh;overflow-y:auto;padding:16px 18px 36px}
@media(min-width:480px){.modal{border-radius:16px;padding:22px 22px 24px;max-height:80vh}}
.modal-drag{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 14px}
@media(min-width:480px){.modal-drag{display:none}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-hdr h2{font-size:15px;font-weight:600}

.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.field input{width:100%;height:38px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 12px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--text3)}
.field-hint{font-size:11px;color:var(--text3);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-ftr{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* Spinner */
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#000;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13px;font-weight:500;transition:transform .25s ease;z-index:999;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <a class="logo" href="#">
      <div class="logo-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
        </svg>
      </div>
      uploader
    </a>
    <div class="user-area" id="userArea" style="display:none">
      <img class="u-avatar" id="uAvatar" src="" alt="">
      <span class="u-name" id="uName"></span>
      <button class="btn-icon" onclick="openSettings()" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 0-14.14 0M4.93 19.07a10 10 0 0 0 14.14 0"/></svg>
      </button>
      <button class="btn-icon" onclick="doSignOut()" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Login -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
      </svg>
    </div>
    <h1>GH Image Uploader</h1>
    <p>Upload gambar & GIF ke GitHub, dapat CDN URL jsDelivr otomatis.</p>
    <button class="btn-google" onclick="doSignIn()">
      <svg viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      Masuk dengan Google
    </button>
  </div>
</div>

<!-- App -->
<div id="appScreen">
  <div class="wrap">
    <div class="notice" id="cfgNotice" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Config belum lengkap. <a onclick="openSettings()">&nbsp;Isi sekarang →</a>
    </div>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*,.gif" multiple>
      <div class="drop-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/>
        </svg>
      </div>
      <div class="drop-title">Drop gambar di sini</div>
      <div class="drop-sub">atau klik untuk pilih file</div>
      <div class="ftags">
        <span class="ftag">JPG</span><span class="ftag">PNG</span><span class="ftag">WEBP</span>
        <span class="ftag">GIF</span><span class="ftag">AVIF</span><span class="ftag">SVG</span>
      </div>
    </div>

    <div id="queueSec" style="display:none">
      <div class="sec-hdr">
        <span class="sec-lbl">Antrian</span>
        <button class="btn btn-ghost" style="height:28px;font-size:12px;padding:0 10px" onclick="clearPending()">Hapus</button>
      </div>
      <div class="q-list" id="queueList"></div>
      <div class="ctl">
        <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/>
          </svg>
          Upload Semua
        </button>
        <span class="ctl-stat" id="uploadStat"></span>
      </div>
    </div>

    <div id="doneSec" style="display:none">
      <div class="divider"></div>
      <div class="sec-hdr">
        <span class="sec-lbl">Selesai</span>
        <button class="btn btn-ghost" style="height:28px;font-size:12px;padding:0 10px" onclick="clearDone()">Bersihkan</button>
      </div>
      <div class="q-list" id="doneList"></div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-hdr">
      <h2>Konfigurasi GitHub</h2>
      <button class="btn-icon" onclick="closeSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <div class="field-hint">github.com/settings/tokens → scope: repo</div>
    </div>
    <div class="field-row">
      <div class="field"><label>Owner</label><input type="text" id="cfgOwner" placeholder="username"></div>
      <div class="field"><label>Repository</label><input type="text" id="cfgRepo" placeholder="my-cdn"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Branch</label><input type="text" id="cfgBranch" placeholder="main"></div>
      <div class="field"><label>Folder <span style="font-weight:400;opacity:.6">(opsional)</span></label><input type="text" id="cfgPath" placeholder="images/"></div>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeSettings()">Batal</button>
      <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();
const gp   = new firebase.auth.GoogleAuthProvider();

let cfg = {}, files = [], user = null;

// ── Auth ──────────────────────────────
auth.onAuthStateChanged(async u => {
  user = u;
  if (u) {
    document.getElementById('uAvatar').src = u.photoURL || '';
    document.getElementById('uName').textContent = (u.displayName||'').split(' ')[0];
    document.getElementById('userArea').style.display = 'flex';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('on');
    await loadConfig();
  } else {
    cfg = {};
    document.getElementById('userArea').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appScreen').classList.remove('on');
  }
});

function doSignIn() {
  auth.signInWithPopup(gp).catch(e => toast('Login gagal: ' + e.message));
}
function doSignOut() { auth.signOut(); }

// ── Firestore ─────────────────────────
async function loadConfig() {
  if (!user) return;
  try {
    const doc = await db.collection('users').doc(user.uid).collection('config').doc('github').get();
    cfg = doc.exists ? doc.data() : {};
  } catch(e) { cfg = {}; }
  checkConfig();
}

async function pushConfig(data) {
  if (!user) return;
  await db.collection('users').doc(user.uid).collection('config').doc('github').set(data);
}

function checkConfig() {
  const ok = cfg.token && cfg.owner && cfg.repo && cfg.branch;
  document.getElementById('cfgNotice').style.display = ok ? 'none' : 'flex';
  if (!ok) openSettings();
}

// ── Settings ──────────────────────────
function openSettings() {
  document.getElementById('cfgToken').value  = cfg.token  || '';
  document.getElementById('cfgOwner').value  = cfg.owner  || '';
  document.getElementById('cfgRepo').value   = cfg.repo   || '';
  document.getElementById('cfgBranch').value = cfg.branch || 'main';
  document.getElementById('cfgPath').value   = cfg.path   || '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('modalOverlay').classList.remove('open');
}
async function saveSettings() {
  let path = document.getElementById('cfgPath').value.trim().replace(/^\/+/,'');
  if (path && !path.endsWith('/')) path += '/';
  const c = {
    token:  document.getElementById('cfgToken').value.trim(),
    owner:  document.getElementById('cfgOwner').value.trim(),
    repo:   document.getElementById('cfgRepo').value.trim(),
    branch: document.getElementById('cfgBranch').value.trim() || 'main',
    path
  };
  cfg = c; closeSettings(); checkConfig();
  try { await pushConfig(c); toast('Config tersimpan ✓'); }
  catch(e) { toast('Gagal sync: ' + e.message); }
}

// ── Drop Zone ─────────────────────────
const dz = document.getElementById('dropZone');
const fi = document.getElementById('fileInput');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); addFiles([...e.dataTransfer.files]); });
fi.addEventListener('change', () => { addFiles([...fi.files]); fi.value=''; });

function addFiles(list) {
  const imgs = list.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  imgs.forEach(f => {
    if (!files.find(x => x.file.name===f.name && x.file.size===f.size))
      files.push({ file:f, id:crypto.randomUUID(), status:'pending', url:null, error:null, progress:0 });
  });
  renderQueue();
}

// ── Render ────────────────────────────
function renderQueue() {
  const pending = files.filter(x => x.status !== 'done');
  const sec = document.getElementById('queueSec');
  const lst = document.getElementById('queueList');
  if (!pending.length) { sec.style.display='none'; updateStat(); return; }
  sec.style.display='block'; lst.innerHTML='';

  pending.forEach(item => {
    const d = document.createElement('div');
    d.className = `q-item ${item.status}`; d.id = `qi-${item.id}`;
    const img = document.createElement('img');
    img.className='q-thumb'; img.alt=item.file.name;
    const r = new FileReader(); r.onload=e=>{ img.src=e.target.result; }; r.readAsDataURL(item.file);

    const bc  = {pending:'bp',uploading:'bu',error:'be'}[item.status]||'bp';
    const bl  = {pending:'Pending',uploading:'...',error:'Error'}[item.status];
    const prog = item.status==='uploading' ? `<div class="q-prog"><div class="q-prog-fill" style="width:${item.progress}%"></div></div>` : '';
    const err  = item.status==='error' ? `<div class="q-err">${item.error||'Upload gagal'}</div>` : '';
    const retry = item.status==='error' ? `<button class="copy-btn" onclick="retryItem('${item.id}')" style="margin-top:5px">Retry</button>` : '';

    d.innerHTML=`<span></span><div class="q-info"><div class="q-name">${item.file.name}</div><div class="q-meta">${fmtSize(item.file.size)}</div>${prog}${err}${retry}</div><span class="q-badge ${bc}">${bl}</span>`;
    d.querySelector('span').replaceWith(img);
    lst.appendChild(d);
  });
  updateStat();
}

function renderDone() {
  const done = files.filter(x => x.status==='done');
  const sec  = document.getElementById('doneSec');
  const lst  = document.getElementById('doneList');
  if (!done.length) { sec.style.display='none'; return; }
  sec.style.display='block'; lst.innerHTML='';

  done.slice().reverse().forEach(item => {
    const d = document.createElement('div');
    d.className='q-item done';
    const img = document.createElement('img');
    img.className='q-thumb'; img.src=item.url; img.alt=item.file.name;
    const mdUrl = `![img](${item.url})`;

    d.innerHTML=`<span></span><div class="q-info"><div class="q-name">${item.file.name}</div><div class="q-meta">${fmtSize(item.file.size)}</div><div class="q-url-row"><span class="q-url">${item.url}</span><button class="copy-btn" onclick="copyText('${item.url}',this)">Copy</button></div><div class="q-url-row" style="margin-top:2px"><span class="q-url" style="color:var(--text3)">${mdUrl}</span><button class="copy-btn" onclick="copyText('${mdUrl}',this)">MD</button></div></div><span class="q-badge bd">✓ Done</span>`;
    d.querySelector('span').replaceWith(img);
    lst.appendChild(d);
  });
}

// ── Upload ────────────────────────────
async function startUpload() {
  if (!cfg.token || !cfg.owner || !cfg.repo) { openSettings(); return; }
  const pending = files.filter(x => x.status==='pending' || x.status==='error');
  if (!pending.length) return;
  const btn = document.getElementById('uploadBtn');
  btn.disabled=true; btn.innerHTML=`<div class="spinner"></div> Uploading...`;

  for (const item of pending) {
    item.status='uploading'; item.progress=20; item.error=null;
    renderQueue();
    try {
      item.progress=65; renderQueue();
      item.url = await uploadFile(item.file);
      item.status='done';
    } catch(e) {
      item.status='error'; item.error=e.message||'Upload gagal';
    }
    renderQueue(); renderDone();
  }

  btn.disabled=false;
  btn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>Upload Semua`;
}

async function uploadFile(file) {
  const b64  = await toBase64(file);
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `${cfg.path||''}${Date.now()}_${safe}`;
  const res  = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    method:'PUT',
    headers:{'Authorization':`Bearer ${cfg.token}`,'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:JSON.stringify({ message:`upload: ${file.name}`, content:b64, branch:cfg.branch })
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.message||`HTTP ${res.status}`); }
  return `https://cdn.jsdelivr.net/gh/${cfg.owner}/${cfg.repo}@${cfg.branch}/${path}`;
}

function toBase64(file) {
  return new Promise((res,rej) => {
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=()=>rej(new Error('Gagal membaca file'));
    r.readAsDataURL(file);
  });
}

// ── Utils ─────────────────────────────
function clearPending() { files=files.filter(x=>x.status==='done'); renderQueue(); }
function clearDone()    { files=files.filter(x=>x.status!=='done'); renderDone(); }
function retryItem(id)  { const i=files.find(x=>x.id===id); if(i){i.status='pending';i.error=null;renderQueue();} }
function updateStat()   { const d=files.filter(x=>x.status==='done').length,t=files.length; document.getElementById('uploadStat').textContent=t?`${d}/${t}`:''; }
function copyText(txt,btn) {
  navigator.clipboard.writeText(txt).then(()=>{
    const o=btn.textContent; btn.textContent='✓'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},1500);
  });
}
function fmtSize(b) { return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'; }
function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
